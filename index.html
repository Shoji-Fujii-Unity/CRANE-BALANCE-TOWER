<title>SWING★STACK 3D| スイングスタック 3D</title>
<style>

  html,body{height:100%;overflow:hidden;background:#0a0a16;

    color:#fff;user-select:none;-webkit-user-select:none;}

  #frame{position:relative;overflow:hidden;touch-action:none;

  #hud{position:absolute;inset:0;pointer-events:none;z-index:10;}

  .iconBtn:active{transform:scale(.92);}
  #hintBar{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;

    animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  #floatLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .fmsg{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-weight:900;font-size:26px;

    filter:drop-shadow(0 4px 14px rgba(251,133,0,.45));}
  .subTitle{font-weight:800;font-size:14px;letter-spacing:.35em;color:var(--cyan);margin-top:-2px;}
  .tagline{font-size:13px;opacity:.85;line-height:1.7;margin-top:2px;white-space:pre-line;}
  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:999px;padding:14px 34px;font-size:16px;
    font-weight:800;letter-spacing:.06em;color:#241505;background:linear-gradient(180deg,#ffd166,var(--accent2));
    box-shadow:0 6px 18px rgba(251,133,0,.4), inset 0 1px 0 #fff8;min-width:200px;transition:transform .1s;}

  .btn.small{padding:10px 20px;font-size:13px;min-width:0;}

  .titleBtns{display:flex;flex-direction:column;gap:10px;margin-top:14px;align-items:center;}
  .langSwitch{display:flex;gap:6px;margin-top:16px;}
  .langSwitch .lb{padding:7px 14px;border-radius:99px;border:1px solid #ffffff33;background:#ffffff10;color:#fff;

  .langSwitch .lb.on{background:var(--accent);color:#241505;border-color:var(--accent);}

  .lvCell .best{font-size:8.5px;font-weight:600;opacity:.7;}
  .lvCell.locked{opacity:.35;}
  .lvCell.cleared{border-color:var(--accent);box-shadow:0 0 10px rgba(255,183,3,.25);}
  .lvCell.endless{grid-column:span 4;aspect-ratio:auto;padding:12px;flex-direction:row;gap:10px;

  .lvCell.endless .best{font-size:11px;}
  #lvFooter{display:flex;gap:12px;margin-top:14px;align-items:center;flex-wrap:wrap;justify-content:center;}
  #resetConfirm{display:flex;gap:8px;}

</head>

      <button class="btn small ghost" id="btnReset"></button>
      <span id="resetConfirm" class="hidden">
        <button class="btn small" id="btnResetYes"></button>
        <button class="btn small ghost" id="btnResetNo"></button>
      </span>
    </div>
  </div>

  <!-- PAUSE -->
  <div class="screen hidden" id="scrPause">
    <div class="scrTitle" id="pauseTitle">PAUSED</div>
    <div class="titleBtns">
      <button class="btn" id="btnResume"></button>
      <button class="btn small ghost" id="btnRestart"></button>
      <button class="btn small ghost" id="btnQuit"></button>
    </div>
  </div>

  <div class="screen hidden" id="scrResult">
    <div id="resStars"></div>
    <div id="resTitle"></div>
    <div id="newRecord" class="hidden"></div>
    <div class="resRows">
      <div class="row"><span id="lblScore"></span><b id="resScore">0</b></div>
      <div class="row"><span id="lblHeight"></span><b id="resHeight">0.00 m</b></div>
      <div class="row"><span id="lblPerfect"></span><b id="resPerfect">0</b></div>
      <div class="row"><span id="lblBest"></span><b id="resBest">-</b></div>
    </div>
    <div class="btnRow">
      <button class="btn small ghost" id="btnRetry"></button>
      <button class="btn small hidden" id="btnNext"></button>
      <button class="btn small ghost" id="btnToLevels"></button>
    </div>
  </div>

  <div class="screen hidden" id="loadBox"><div class="spinner"></div><p id="loadMsg"></p></div>
  <div class="screen hidden" id="errBox"><p>⚠️</p><p id="errMsg"></p></div>
</div>

<script>
  // boot watchdog: CDN libs failed to load?
  window.__booted = false;
  setTimeout(function(){
    if(!window.__booted && !document.getElementById('errBox').classList.contains('hidden')) {}
    if(!window.__booted){
      document.getElementById('loadBox').classList.add('hidden');
      document.getElementById('errBox').classList.remove('hidden');
      var msgs={ja:'3Dライブラリの読み込みに失敗しました。インターネット接続を確認してください。',
        en:'Failed to load 3D libraries. Please check your internet connection.',
        zh:'加载3D库失败，请检查您的网络连接。'};
      var l=(function(){try{return JSON.parse(localStorage.getItem('swingstack_v1')||'{}').lang||'ja'}catch(e){return 'ja'}})();
      document.getElementById('errMsg').textContent = msgs[l]||msgs.en;
    }
  }, 12000);
</script>

let save = {lang:'ja', sound:true, cleared:{}, best:{}};
try{ const raw=localStorage.getItem(SAVE_KEY); if(raw){ const s=JSON.parse(raw); save={...save,...s}; } }catch(e){}
if(!['ja','en','zh'].includes(save.lang)) save.lang='ja';
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
const $=id=>document.getElementById(id);
function t(k){ return (I18N[save.lang] && I18N[save.lang][k]) || I18N.en[k] || k; }

/* ---------------- audio (WebAudio, procedural) ---------------- */
const SFX = {
  ctx:null, on:save.sound, master:null, bgmGain:null, bgmTimer:null,
  ensure(){ if(this.ctx) return; try{
      const AC = window.AudioContext||window.webkitAudioContext; this.ctx=new AC();
      this.master=this.ctx.createGain(); this.master.gain.value=this.on?0.5:0; this.master.connect(this.ctx.destination);
      this.bgmGain=this.ctx.createGain(); this.bgmGain.gain.value=0.06; this.bgmGain.connect(this.master);
    }catch(e){ this.ctx=null; } },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(freq,dur,type,vol,slideTo){ if(!this.ctx||!this.on) return; const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),c.currentTime+dur);

    o.connect(g); g.connect(this.master); o.start(); o.stop(c.currentTime+dur+0.02); },

    const len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);

  click(){ this.tone(660,0.06,'triangle',0.15); },

  hit(v){ const p=Math.min(1,(v||3)/8); this.noise(0.12,0.25+p*0.3,500+p*700); this.tone(90+p*40,0.14,'sine',0.25,55); },

  clear(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>this.tone(f,0.3,'triangle',0.22),i*110)); },
  fail(){ [392,330,262,196].forEach((f,i)=>setTimeout(()=>this.tone(f,0.3,'sawtooth',0.12),i*160)); },
  startBgm(){ if(!this.ctx||this.bgmTimer) return; const scale=[262,294,330,392,440,523]; let step=0;
    this.bgmTimer=setInterval(()=>{ if(!this.on||!this.ctx) return;

      if(Math.random()<0.7){ const n=scale[(Math.random()*scale.length)|0]; this.bgmNote(n*(Math.random()<0.3?2:1),0.5,'triangle',0.03); }

/* ---------------- crane motion ---------------- */
function tri(u){ u=((u%4)+4)%4; return u<1?u : u<3?2-u : u-4; } // -2..2
function newCfg(){
  const pk=stage.pat[(Math.random()*stage.pat.length)|0];
  const base=PAT[pk];
  const j=(v,k=0.3)=> v==null?undefined : v*(1-k+Math.random()*2*k);
  const ph=()=>Math.random()*Math.PI*2;
  const cfg={name:pk};
  if(base.B!=null){ cfg.B=j(base.B); cfg.w=j(base.w,0.25); cfg.pB=ph(); }
  if(base.A!=null){ cfg.A=j(base.A); cfg.wA=j(base.wA,0.25); cfg.pA=ph(); }
  if(base.tri!=null){ cfg.tri=j(base.tri); cfg.sp=j(base.sp,0.3); cfg.pT=ph(); }
  if(base.C!=null){ cfg.C=j(base.C); cfg.wC=j(base.wC,0.3); cfg.pC=ph(); }
  return cfg;
}
function hookAt(tt, out){
  const c=crane.cfg;
  let x=0;
  if(c.B!=null) x+=c.B*Math.sin(c.w*tt+c.pB);
  if(c.tri!=null) x+=c.tri*tri(c.sp*tt+c.pT/2);
  x=THREE.MathUtils.clamp(x,-2.85,2.85);
  const th=(c.A!=null? c.A : 0)/crane.L*Math.sin((c.wA||2.2)*tt+(c.pA||0));
  const bob=(c.C!=null? c.C:0)*Math.sin((c.wC||1.6)*tt+(c.pC||0));
  out.set(x, crane.pivotY - crane.L*Math.cos(th) + bob, 0);
  return th;
}

/* ---------------- part spawn / drop ---------------- */
function pickType(){ const arr=stage.parts; return TYPES[arr[(Math.random()*arr.length)|0]]; }
function makeMesh(type){
  let mesh;
  const mat=new THREE.MeshStandardMaterial({color:type.c, roughness:0.55, metalness:0.12});
  if(type.group){
    mesh=new THREE.Group();
    type.geos().forEach(gg=>{ const m=new THREE.Mesh(gg.g, mat); m.position.set(...gg.p); m.castShadow=true; m.receiveShadow=true; mesh.add(m); });
    mesh.userData.mat=mat;
  }else{
    mesh=new THREE.Mesh(type.geo(), mat); mesh.castShadow=true; mesh.receiveShadow=true; mesh.userData.mat=mat;
  }
  return mesh;
}
function spawnAttached(){
  crane.cfg=newCfg();
  crane.t=0;
  const type=pickType();
  const mesh=makeMesh(type);
  const yaw= type.rotY ? Math.random()*Math.PI*2 : (Math.random()-0.5)*0.3;
  mesh.rotation.y=yaw;
  scene.add(mesh);
  attached={mesh, type, yaw};
  SFX.swingLabel();
  floatText(t(PAT_NAME[crane.cfg.name]), '#9fd8ff', 0.55, true);
}
function dropPart(){
  if(!attached) return;
  const a=attached; attached=null;
  const hook=crane.hook;
  const body=new CANNON.Body({mass:a.type.mass});
  a.type.shapes().forEach(ss=> body.addShape(ss.s, ss.o));
  body.position.set(hook.x, hook.y - a.type.hangTop, 0);
  const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), a.yaw);
  body.quaternion.set(q.x,q.y,q.z,q.w);
  body.allowSleep=true; body.sleepSpeedLimit=0.18; body.sleepTimeLimit=0.4;
  body.linearDamping=0.06; body.angularDamping=0.2;
  world.addBody(body);
  const p={mesh:a.mesh, body, type:a.type, landed:false, missed:false, perfect:false, sinceDrop:0};
  body.addEventListener('collide', ev=>onLand(p, ev));
  parts.push(p);
  dropCount++; lastDropAt=gameTime;
  nextDropAt=gameTime+0.55;
  SFX.drop();
}
function onLand(p, ev){
  if(p.landed || over) return;
  p.landed=true;
  let imp=1; try{ imp=Math.abs(ev.contact.getImpactVelocityAlongNormal()); }catch(e){}
  SFX.hit(imp); shakeAmp=Math.min(0.5, imp*0.045);
  const d=Math.hypot(p.body.position.x, p.body.position.z);
  if(d<0.32){
    p.perfect=true; perfectCount++; score+=250;
    SFX.perfect(); floatText(t('f_perfect'),'#ffd166');
    spawnRing(new THREE.Vector3(p.body.position.x, p.body.position.y, p.body.position.z));
  }
  const mat=p.mesh.userData.mat;
  if(mat){ mat.emissive=new THREE.Color(0xffffff); mat.emissiveIntensity=0.55; flashes.push({m:mat,k:1}); }
  updateScoreHud();
}
function removePart(p){
  const i=parts.indexOf(p); if(i>=0) parts.splice(i,1);
  if(world&&p.body) world.removeBody(p.body);
  scene.remove(p.mesh);
}
function onMiss(){
  if(over) return;
  lives--; SFX.miss(); floatText(t('f_miss'),'#ff5d73'); shakeAmp=Math.max(shakeAmp,0.4);
  updateHeartsHud();
  if(lives<=0) endStage(false);
}
function spawnRing(pos){
  const m=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.05,8,28),
    new THREE.MeshBasicMaterial({color:0xffd166, transparent:true, opacity:0.9}));
  m.rotation.x=Math.PI/2; m.position.copy(pos); scene.add(m);
  rings.push({m,k:1});
}

}

/* ---------------- stage flow ---------------- */
let gameTime=0, lastRAF=performance.now();
function startStage(st){
  stage=st;
  buildField(stage);
  lives=stage.miss; score=0; perfectCount=0; dropCount=0; towerTop=0; maxTowerTop=0;
  over=false; attached=null; nextDropAt=0; gameTime=0;
  crane.t=0; crane.pivotY=CRANE_PIVOT_MIN; crane.beamY=CRANE_PIVOT_MIN;
  camPos.set(0,2.5,14.5); camLook.set(0,0.6,0);
  state='playing'; showScreen(null);
  $('hud').classList.remove('hidden');
  $('stName').textContent=(stage.id==='e'? t('lv_endless') : (save.lang==='ja'? 'ステージ '+stage.id : 'STAGE '+stage.id))+(stage.tag?' — '+stage.tag:'');
  $('targetVal').textContent= stage.tgt>0? stage.tgt.toFixed(1):'∞';
  $('progressWrap').classList.toggle('hidden', !!stage.endless);
  $('hintBar').textContent=t('hint_tap');
  $('bestVal').textContent= save.best[stage.id]!=null? Math.round(save.best[stage.id]) : '-';
  updateHeartsHud(); updateScoreHud(); updateHeightHud();
  spawnAttached();
}
function endStage(win){
  if(over) return; over=true;
  if(attached){ scene.remove(attached.mesh); attached=null; }
  const heightScore=Math.round(maxTowerTop*100);
  const finalScore= win? score+heightScore+lives*500 : score;
  const rec=(save.best[stage.id]==null);
  const isBest= win? maxTowerTop>=(stage.tgt||Infinity) : maxTowerTop>=(save.best[stage.id]||0);
  const prevBest=save.best[stage.id];
  if(save.best[stage.id]==null || finalScore>save.best[stage.id]) save.best[stage.id]=finalScore;
  if(stage.endless){
    const prevE=save.best['e_h']||0;
    if(maxTowerTop>prevE){ save.best['e_h']=maxTowerTop; if(!prevE) {} }
  }
  if(win) save.cleared[stage.id]=Math.max(save.cleared[stage.id]||0, Math.max(1,(lives)));
  persist();
  state='result';
  win? SFX.clear() : SFX.fail();
  setTimeout(()=>showResult(win, finalScore, prevBest), 500);
}
function showResult(win, finalScore, prevBest){
  $('hud').classList.add('hidden');
  showScreen('result');
  $('resTitle').textContent= win? t('res_clear') : t('res_fail');
  $('resTitle').style.color= win? '#7ef9ff':'#ff5d73';
  const stars= win? (lives>=3?3: lives===2?2:1) : 0;
  $('resStars').textContent= '★'.repeat(stars)+'☆'.repeat(3-stars);
  $('resScore').textContent=Math.round(finalScore);
  $('resHeight').textContent=maxTowerTop.toFixed(2)+' m';
  $('resPerfect').textContent='× '+perfectCount;
  $('resBest').textContent= save.best[stage.id]!=null? Math.round(save.best[stage.id]) : '-';
  const nr= finalScore> (prevBest||0);
  $('newRecord').classList.toggle('hidden', !nr);
  $('newRecord').textContent=t('res_new');
  $('lblScore').textContent=t('lbl_score'); $('lblHeight').textContent=t('lbl_height');
  $('lblPerfect').textContent=t('lbl_perfect'); $('lblBest').textContent=t('lbl_best');
  $('btnRetry').textContent=t('btn_retry'); $('btnNext').textContent=t('btn_next'); $('btnToLevels').textContent=t('btn_select');
  const nextIdx=STAGES.findIndex(s=>s.id===stage.id)+1;
  const hasNext= win && nextIdx>0 && nextIdx<STAGES.length && !stage.endless;
  $('btnNext').classList.toggle('hidden', !hasNext);
  if(hasNext) $('btnNext').onclick=()=>startStage(STAGES[nextIdx]);
}

/* ---------------- HUD helpers ---------------- */
function updateHeartsHud(){
  $('hearts').innerHTML=[0,1,2].map(i=>`<span class="hp${i<lives?'':' off'}">♥</span>`).join('');
}
function updateScoreHud(){ $('scoreVal').textContent=Math.round(score); }
function updateHeightHud(){
  $('heightVal').textContent=towerTop.toFixed(2);
  if(stage && stage.tgt>0){
    $('progressBar').style.width=Math.min(100, towerTop/stage.tgt*100).toFixed(1)+'%';
  }
}
function floatText(msg, color, y=0, small=false){
  const el=document.createElement('div');
  el.className='fmsg'+(small?' small':'');
  el.style.color=color||'#fff';
  el.style.top=(26+(y*14))+'%';
  el.textContent=msg;
  $('floatLayer').appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

/* ---------------- screens ---------------- */
function showScreen(name){
  scr=name||scr;
  ['title','how','levels','pause','result'].forEach(s=>$('scr'+s[0].toUpperCase()+s.slice(1)).classList.add('hidden'));
  if(name) $('scr'+name[0].toUpperCase()+name.slice(1)).classList.remove('hidden');
}
function goTitle(){ state='menu'; menuDecor.visible=true; showScreen('title'); $('hud').classList.add('hidden'); applyLang(); }
function goLevels(){ state='menu'; menuDecor.visible=true; buildLevelGrid(); showScreen('levels'); $('hud').classList.add('hidden'); applyLang(); }
function buildLevelGrid(){
  const g=$('levelGrid'); g.innerHTML='';
  STAGES.forEach(st=>{
    const cell=document.createElement('button');
    const unl=unlocked(st.id), cl=isCleared(st.id);
    if(st.endless){
      cell.className='lvCell endless';
      const bh=save.best['e_h'];
      cell.innerHTML=`<span>${t('lv_endless')}</span><span class="best">${bh?('MAX '+bh.toFixed(2)+' m'):''}</span>`;
    }else{
      cell.className='lvCell'+(unl?'':' locked')+(cl?' cleared':'');
      const stars=cl? '★'.repeat(cl)+'☆'.repeat(3-cl):'';
      const best=save.best[st.id];
      cell.innerHTML=`<span>${unl?st.id:'🔒'}</span><span class="stars">${stars}</span><span class="best">${best!=null?best:''}</span>`;
    }
    cell.onclick=()=>{ if(unl){ SFX.click(); startStage(st);} };
    g.appendChild(cell);
  });
}
function applyLang(){
  document.documentElement.lang=save.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $('tSub').textContent=t('sub');
  $('tTag').textContent=t('tag');
  const hasSave= Object.keys(save.cleared).length>0 || Object.keys(save.best).length>0;
  $('btnStart').textContent= hasSave? t('btn_continue'):t('btn_start');
  $('btnEndless').classList.remove('hidden');
  $('btnEndless').textContent=t('btn_endless');
  $('btnHow').textContent=t('btn_how');
  $('btnSoundT').textContent= SFX.on? t('sound_on'):t('sound_off');
  $('btnSoundH').textContent= SFX.on?'🔊':'🔇';
  $('howTitle').textContent=t('how_title');
  $('howBox').innerHTML=t('how').map(l=>`<div>${l}</div>`).join('');
  $('btnHowBack').textContent=t('btn_back');
  $('lvTitle').textContent=t('lv_title');
  $('btnBackTitle').textContent=t('btn_back');
  $('btnReset').textContent=t('btn_reset');
  $('btnResetYes').textContent=t('reset_yes'); $('btnResetNo').textContent=t('reset_no');
  $('pauseTitle').textContent=t('pause_title');
  $('btnResume').textContent=t('btn_resume'); $('btnRestart').textContent=t('btn_restart'); $('btnQuit').textContent=t('btn_quit');
  $('btnRetry').textContent=t('btn_retry'); $('btnNext').textContent=t('btn_next'); $('btnToLevels').textContent=t('btn_select');
  document.querySelectorAll('.langSwitch .lb').forEach(b=>b.classList.toggle('on', b.dataset.lang===save.lang));
  $('rotHint').textContent=t('rot_hint');
  if(stage) $('hintBar').textContent=t('hint_tap');
  if(scr==='levels') buildLevelGrid();
}

/* ---------------- input ---------------- */
frame.addEventListener('pointerdown', e=>{
  if(e.button!==undefined && e.button!==0) return;
  if(state==='playing' && !over && attached && gameTime-lastDropAt>0.3){
    dropPart();
  }
});
window.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='Enter'){
    if(state==='playing' && !over && attached && gameTime-lastDropAt>0.3){ e.preventDefault(); dropPart(); }
  }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state==='playing') pauseGame(); else if(state==='paused') resumeGame(); }
});
function pauseGame(){ if(state!=='playing')return; state='paused'; showScreen('pause'); }
function resumeGame(){ if(state!=='paused')return; state='playing'; showScreen(null); lastRAF=performance.now(); }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && state==='playing') pauseGame(); });

$('btnStart').onclick=()=>{ SFX.click(); goLevels(); };
$('btnEndless').onclick=()=>{ SFX.click(); startStage(stageById('e')); };
$('btnHow').onclick=()=>{ SFX.click(); showScreen('how'); };
$('btnHowBack').onclick=()=>{ SFX.click(); showScreen('title'); };
$('btnBackTitle').onclick=()=>{ SFX.click(); goTitle(); };
$('btnReset').onclick=()=>{ $('btnReset').classList.add('hidden'); $('resetConfirm').classList.remove('hidden'); };
$('btnResetNo').onclick=()=>{ $('resetConfirm').classList.add('hidden'); $('btnReset').classList.remove('hidden'); };
$('btnResetYes').onclick=()=>{
  save={lang:save.lang, sound:save.sound, cleared:{}, best:{}}; persist();
  $('resetConfirm').classList.add('hidden'); $('btnReset').classList.remove('hidden'); buildLevelGrid();
};
function toggleSound(){ SFX.ensure(); SFX.setOn(!SFX.on); SFX.click(); applyLang(); }
$('btnSoundT').onclick=toggleSound;
$('btnSoundH').onclick=toggleSound;
$('btnPause').onclick=()=>{ SFX.click(); pauseGame(); };
$('btnResume').onclick=()=>{ SFX.click(); resumeGame(); };
$('btnRestart').onclick=()=>{ SFX.click(); startStage(stage); };
$('btnQuit').onclick=()=>{ SFX.click(); goLevels(); };
$('btnRetry').onclick=()=>{ SFX.click(); startStage(stage); };
$('btnToLevels').onclick=()=>{ SFX.click(); goLevels(); };
document.querySelectorAll('.langSwitch .lb').forEach(b=>{
  b.onclick=()=>{ save.lang=b.dataset.lang; persist(); SFX.click(); applyLang(); };
});

/* rotate hint for mobile landscape */
function checkRotateHint(){
  const coarse=matchMedia('(pointer: coarse)').matches;
  const land=matchMedia('(orientation: landscape)').matches;
  $('rotHint').classList.toggle('hidden', !(coarse&&land&&state==='playing'));
}
matchMedia('(orientation: landscape)').addEventListener?.('change', checkRotateHint);

/* resize */
function onResize(){
  const w=frame.clientWidth,h=frame.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.fov = h>w ? 55 : 48;
  camera.updateProjectionMatrix();
}
new ResizeObserver(onResize).observe(frame);
onResize();

/* ---------------- main loop ---------------- */
const hookTmp=new THREE.Vector3();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-lastRAF)/1000; lastRAF=now;
  if(dt>0.1) dt=0.1;

  if(world && (state==='playing' || state==='result')){
    // ----- crane: pivot rises as the tower grows -----
    if(state==='playing'){
      gameTime+=dt;
      // wind pushes only airborne parts
      if(stage.wind){
        const wf=windForce()*2.0;
        const zero=new CANNON.Vec3(0,0,0);
        for(const p of parts){
          if(!p.landed || p.body.velocity.lengthSquared()>0.3){
            p.body.applyForce(new CANNON.Vec3(wf*p.type.mass,0,0), zero);
          }
        }
      }
      const targetPivot=Math.max(CRANE_PIVOT_MIN, towerTop+HOOK_ABOVE_TOP+4.6);
      crane.pivotY+= (targetPivot-crane.pivotY)*Math.min(1,dt*1.2);
      crane.L=crane.pivotY-(towerTop+HOOK_ABOVE_TOP);
      updateGantry(crane.pivotY);
      crane.t+=dt;
      const th=hookAt(crane.t, crane.hook);
      // gantry visuals: trolley rides the beam; cable runs trolley -> hook in 3D
      if(gantry.trolley){
        const pivX=THREE.MathUtils.clamp(crane.hook.x - crane.L*Math.sin(th), -3.4, 3.4);
        gantry.trolley.position.set(pivX, crane.pivotY-0.3, gantry.gz);
        gantry.hook.position.copy(crane.hook);
        const p0=new THREE.Vector3(pivX, crane.pivotY-0.15, gantry.gz);
        const dirV=crane.hook.clone().sub(p0); const len=dirV.length();
        gantry.cable.scale.y=Math.max(0.05,len);
        gantry.cable.position.copy(p0).addScaledVector(dirV,0.5);
        gantry.cable.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirV.normalize());
      }
      // attached part follows hook; otherwise wait for next drop window
      if(attached){
        attached.mesh.position.set(crane.hook.x, crane.hook.y-attached.type.hangTop, 0);
      }else if(!over && gameTime>=nextDropAt){
        spawnAttached();
      }
    }

    world.step(1/120, dt, 10);

    // ----- sync meshes, track tower top, remove out-of-field parts -----
    let top=0;
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i], b=p.body;
      p.mesh.position.set(b.position.x,b.position.y,b.position.z);
      p.mesh.quaternion.set(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w);
      b.updateAABB();
      const ay=b.aabb? b.aabb.upperBound.y : b.position.y;
      if(ay>top) top=ay;
      p.sinceDrop+=dt;
      const pos=b.position;
      const out = pos.y < -3.4 || Math.abs(pos.x)>6.8 || Math.abs(pos.z)>6.8;
      if(out && p.sinceDrop>0.25){
        if(!p.missed){ p.missed=true; onMiss(); }
        removePart(p);
      }
    }
    towerTop=Math.max(0,top);
    if(towerTop>maxTowerTop) maxTowerTop=towerTop;
    if(state==='playing'){
      updateHeightHud();
      // ----- clear check (settled tower, target reached) -----
      if(!stage.endless && !over && !attached && towerTop>=stage.tgt){
        const settled = parts.every(p=> p.body.sleepState===CANNON.Body.SLEEPING ||
          (p.body.velocity.lengthSquared()<0.012 && p.body.angularVelocity.lengthSquared()<0.05));
        const allLanded = parts.every(p=>p.landed);
        if(settled && allLanded && parts.length>0){
          floatText(t('f_target'),'#7ef9ff');
          endStage(true);
        }
      }
    }
  }

  // effects (always update)
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.k-=dt*1.4;
    if(r.k<=0){ scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); rings.splice(i,1); continue; }
    r.m.scale.setScalar(1+(1-r.k)*1.6); r.m.material.opacity=r.k; }
  for(let i=flashes.length-1;i>=0;i--){ const f=flashes[i]; f.k-=dt*2.2;
    if(f.k<=0){ f.m.emissiveIntensity=0; flashes.splice(i,1); continue; } f.m.emissiveIntensity=f.k*0.55; }

  // camera
  if(state==='menu'){
    menuSpin+=dt*0.25;
    camera.position.set(Math.sin(menuSpin)*8, 4.5+Math.sin(menuSpin*0.7), Math.cos(menuSpin)*8);
    camera.lookAt(0,1.6,0);
  }else{
    const topY=towerTop;
    const centerX=0;
    const centerY= topY*0.5+2;
    const halfView= topY+ (camera.fov===55? 7.6:9.5);
    const camZ=Math.min(46, halfView/Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
    const tgtPos=new THREE.Vector3(centerX, centerY + halfView*0.08, camZ);
    camPos.lerp(tgtPos, Math.min(1,dt*2.2));
    const tgtLook=new THREE.Vector3(centerX, topY*0.45+0.6, 0);
    camLook.lerp(tgtLook, Math.min(1,dt*2.2));
    const sx=(Math.random()-0.5)*shakeAmp, sy=(Math.random()-0.5)*shakeAmp;
    camera.position.set(camPos.x+sx, camPos.y+sy, camPos.z);
    camera.lookAt(camLook);
    shakeAmp=Math.max(0, shakeAmp-dt*1.2);
  }

  checkRotateHint();
  renderer.render(scene, camera);
}

/* menu idle decor: a little stacked tower on the title */
function buildMenuDecor(){
  const g=new THREE.Group();
  let y=0;
  const sizes=[[1.1,0.5],[0.9,0.6],[0.6,0.9],[1.0,0.4]];
  const cols=[0xff5d73,0xffd23f,0x2ec4b6,0x9b5de5];
  sizes.forEach((s,i)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(s[0],s[1],0.8),
      new THREE.MeshStandardMaterial({color:cols[i], roughness:0.5}));
    m.position.set((Math.random()-0.5)*0.12, y+s[1]/2, 0); m.castShadow=true; m.userData.tempDispose=true;
    g.add(m); y+=s[1];
  });
  g.position.set(0,-0.5,0);
  scene.add(g);
  return g;
}
const menuDecor=buildMenuDecor();

/* boot */
window.__booted=true;
$('loadBox').classList.add('hidden');
applyLang();
showScreen('title');
requestAnimationFrame(n=>{ lastRAF=n; loop(n); });
</script>
